name: Keep Render Alive

# Render free tier ngu sau ~15 phut khong co request -> socket realtime rot +
# cold-start ~30s. Workflow nay ping /api/health moi 10 phut de giu instance thuc.
# Luu y quota: repo PUBLIC = Actions mien phi khong gioi han. Repo PRIVATE = 2000
# phut/thang (*/10 ~ 1800 phut/thang, gan sat tran -> neu private can nang len */15).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          URL="${{ vars.RENDER_HEALTH_URL || 'https://zero4-app-chia-se-anh.onrender.com/api/health' }}"
          echo "Pinging $URL"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Render is awake."
              exit 0
            fi
            sleep 20
          done
          echo "WARNING: Render did not return 200 (may be deploying or down)."
          exit 0
